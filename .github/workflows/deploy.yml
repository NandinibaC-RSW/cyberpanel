name: Deploy

on:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  # main  -> LIVE production panel (/usr/local/CyberCP, port 8090)
  deploy-production:
    if: github.repository == 'NandinibaC-RSW/cyberpanel' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, cyberpanel]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout (provides scripts/deploy-production.sh)
        uses: actions/checkout@v4

      - name: Deploy to production (/usr/local/CyberCP, panel.rainflowweb.com)
        run: bash scripts/deploy-production.sh "${{ github.sha }}"

  # development -> staging panel (/var/www/html/cyberpanel, port 8091)
  deploy-staging:
    if: github.repository == 'NandinibaC-RSW/cyberpanel' && github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    runs-on: [self-hosted, cyberpanel]
    concurrency:
      group: staging-deploy-v2
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Checkout (provides scripts/deploy-staging.sh)
        uses: actions/checkout@v4

      - name: Deploy to staging (/var/www/html/cyberpanel)
        run: bash scripts/deploy-staging.sh "${{ github.sha }}"
